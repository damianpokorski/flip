name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # mise.toml is the single source of truth for these versions — read them here so
      # this workflow can't drift from it (package.json's packageManager field and the
      # Dockerfile's oven/bun pins can't read TOML directly, so those two stay manually
      # pinned and are cross-checked against mise.toml by the "Check version pins" step
      # below instead).
      - name: Read tool versions from mise.toml
        id: mise
        run: |
          echo "bun=$(scripts/mise-tool-version.sh bun)" >> "$GITHUB_OUTPUT"
          echo "caddy=$(scripts/mise-tool-version.sh caddy)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.mise.outputs.bun }}

      # CaddyProxyService is always spawned by apps/server, in dev too, so it must be on
      # PATH before the e2e step's webServer boots the real dev servers (not just a
      # Docker/production concern).
      - name: Set up Caddy
        run: |
          curl -sSL "https://github.com/caddyserver/caddy/releases/download/v${{ steps.mise.outputs.caddy }}/caddy_${{ steps.mise.outputs.caddy }}_linux_amd64.tar.gz" \
            | tar -xz caddy
          sudo mv caddy /usr/local/bin/caddy
          caddy version

      - name: Check version pins
        run: bun run check-versions

      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      # --with-deps installs the Ubuntu system libraries Chromium needs. The repo's own
      # `test:e2e:install` script deliberately skips --with-deps (it also has to work in
      # sandboxes without passwordless sudo); GitHub-hosted runners have full sudo, and a
      # bare `playwright install` here would likely fail outright on a cold cache.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      # Runs against a disposable, self-seeding data dir — apps/web/playwright.config.ts's
      # webServer entries wipe/bootstrap before listening, so no CI-specific setup is needed.
      - name: E2E / browser tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Build Docker image
        run: docker build -t flip:ci .

      - name: Docker smoke test
        run: |
          docker run -d --name flip-ci -p 8080:8080 -v flip-ci-data:/data flip:ci

          ready=false
          for _ in $(seq 1 15); do
            if curl -sf http://localhost:8080/api/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "::error::Container never became healthy"
            docker logs flip-ci
            exit 1
          fi

          echo "Container is healthy"

      - name: Tear down smoke-test container
        if: always()
        run: |
          docker rm -f flip-ci 2>/dev/null || true
          docker volume rm flip-ci-data 2>/dev/null || true
