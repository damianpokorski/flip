# Single source of truth for these tool versions. Read dynamically in CI by
# scripts/mise-tool-version.sh (ci.yml/release.yml); package.json's `packageManager`
# field and the Dockerfile's `oven/bun:` pins can't read TOML directly, so they stay
# manually pinned and are instead cross-checked against this file by
# scripts/check-tool-versions.sh (`bun run check-versions`).
[tools]
bun = "1.3.14"
# Embedded reverse proxy (apps/server/src/services/CaddyProxyService.ts) — always spawned by
# the server in both dev and prod, so it's a required local prerequisite like bun. Keep this
# in sync with the `caddy:2` image vendored in the Dockerfile's runtime stage.
caddy = "2.11.4"



[tasks.dev]
description = 'Runs backend and frontend side by side using tmux'

env = { SESH = 'flip' }
run = '''
#!/usr/bin/env bash

if tmux has-session -t "$SESH" 2>/dev/null; then
  tmux attach-session -t "$SESH"
  exit 0
fi

tmux new-session -d -s "$SESH"

tmux send-keys -t "$SESH" "bun run dev:server" Enter

tmux split-window -h -t "$SESH"
tmux send-keys -t "$SESH" "bun run dev:web" Enter

tmux attach-session -t "$SESH"
'''
